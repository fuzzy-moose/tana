version: "2"
sql:
  - engine: postgresql
    schema: internal/local/storage/migrations
    queries: internal/local/refresh/queries.sql
    gen:
      go:
        package: dbgen
        sql_package: "pgx/v5"
        out: internal/local/refresh/dbgen
        emit_empty_slices: true
        omit_unused_structs: true
        overrides: &overrides
          # Zero and nil times mean NULL at the Go boundary of nullable columns.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.int4"
            go_type: "int64"
          # LIMIT and OFFSET arguments.
          - db_type: "integer"
            go_type: "int64"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
  - engine: postgresql
    schema: internal/local/storage/migrations
    queries: internal/local/cleanup/queries.sql
    gen:
      go:
        package: dbgen
        sql_package: "pgx/v5"
        out: internal/local/cleanup/dbgen
        emit_empty_slices: true
        omit_unused_structs: true
        overrides: *overrides
