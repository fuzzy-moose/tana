name: tana

# After `docker compose up -d postgres`, create the roles and databases with
# deploy/postgres/provision.sh -H postgres tana-postgres-1 tana tana_collector
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tana:
    image: ghcr.io/fuzzy-moose/tana:main
    environment:
      TANA_DATABASE_URL: ${TANA_DATABASE_URL}
    ports:
      - "8080:8080"
    volumes:
      - tana-data:/data
      # Register /library in Tana; files must be readable by UID/GID 65532.
      # rslave shows mounts made under this path after start, such as a NAS share.
      - type: bind
        source: ${TANA_LIBRARY_DIR}
        target: /library
        read_only: true
        bind:
          propagation: rslave
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    image: ghcr.io/fuzzy-moose/tana-collector:main
    environment:
      TANA_COLLECTOR_DATABASE_URL: ${TANA_COLLECTOR_DATABASE_URL}
      PANDA_FEED_URL: ${PANDA_FEED_URL}
      PANDA_API_URL: ${PANDA_API_URL}
      PANDA_FAVORITES_URL: ${PANDA_FAVORITES_URL}
      PANDA_FAVORITES_COOKIES: ${PANDA_FAVORITES_COOKIES}
      PANDA_ARCHIVER_URL: ${PANDA_ARCHIVER_URL}
      TANA_COLLECTOR_API_TOKEN: ${TANA_COLLECTOR_API_TOKEN}
    ports:
      - "8081:8080"
    volumes:
      - collector-data:/data
      - collector-downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  tana-data:
  collector-data:
  collector-downloads:
